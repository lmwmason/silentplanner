[package]
name = "silent-planner"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "=0.22.1"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
