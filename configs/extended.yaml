# Prespecified candidate grid for the exploratory grouped comparison.
polynomial_ridge:
  - {degree: 2, alpha: 1.0}
  - {degree: 3, alpha: 10.0}
extra_trees:
  - {n_estimators: 300, min_samples_leaf: 3}
  - {n_estimators: 300, min_samples_leaf: 8}
hist_gradient_boosting:
  - {max_iter: 150, max_leaf_nodes: 7, min_samples_leaf: 8, l2_regularization: 1.0}
  - {max_iter: 200, max_leaf_nodes: 15, min_samples_leaf: 5, l2_regularization: 3.0}
rbf_svr:
  - {C: 1.0, gamma: scale, epsilon: 0.15}
  - {C: 5.0, gamma: scale, epsilon: 0.15}
mlp:
  - {hidden_layer_sizes: [64, 32], alpha: 0.01}
  - {hidden_layer_sizes: [256, 128, 64], alpha: 0.1}
mlp_common:
  solver: adam
  batch_size: 32
  max_iter: 250
  tol: 0.001
  n_iter_no_change: 20
  early_stopping: false
